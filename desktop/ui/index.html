<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Trace</title>
<style>
  :root { color-scheme: dark light; --bg:#0b0e14; --fg:#e6edf3; --muted:#8b949e; --accent:#3b82f6; --err:#f85149; --panel:#11151c; --line:#232b38; }
  @media (prefers-color-scheme: light) { :root { --bg:#f6f8fa; --fg:#1f2328; --muted:#59636e; --panel:#fff; --line:#d1d9e0; } }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
         display: flex; align-items: center; justify-content: center; }
  main { text-align: center; max-width: 520px; padding: 24px; }
  .logo { width: 64px; height: 64px; margin: 0 auto 18px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 6px; }
  #status { color: var(--muted); min-height: 1.5em; }
  .spinner { width: 22px; height: 22px; margin: 18px auto 0; border: 2px solid var(--line); border-top-color: var(--accent);
             border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #error { display: none; margin-top: 18px; text-align: left; background: var(--panel); border: 1px solid var(--line);
           border-left: 3px solid var(--err); border-radius: 8px; padding: 12px 14px; }
  #error pre { white-space: pre-wrap; word-break: break-word; margin: 6px 0 12px; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  button { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; font: inherit; }
  button:hover { border-color: var(--accent); }
  body.failed .spinner { display: none; }
  body.failed #error { display: block; }
</style>
</head>
<body>
<main>
  <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#bc8cff"/></linearGradient></defs><rect width="64" height="64" rx="14" fill="url(#g)"/><path d="M32 12 L50 32 L32 52 L14 32 Z" fill="#fff"/></svg>
  <h1>Agent Trace</h1>
  <div id="status">Starting the tracer…</div>
  <div class="spinner"></div>
  <div id="error">
    <strong>Could not start</strong>
    <pre id="errorText"></pre>
    <button id="restart">Restart</button>
    <button id="data">Open data folder</button>
  </div>
</main>
<script>
  // The Rust side reports progress by evaluating these.
  window.setStatus = (text) => { document.getElementById('status').textContent = text; };
  window.showError = (text) => {
    document.body.classList.add('failed');
    document.getElementById('status').textContent = '';
    document.getElementById('errorText').textContent = text;
  };
  const invoke = (cmd, args) => window.__TAURI_INTERNALS__.invoke(cmd, args || {});
  document.getElementById('restart').onclick = () => invoke('restart_app');
  document.getElementById('data').onclick = () => invoke('open_data_dir').catch(e => alert(e));
  // Start-up may have failed before this page finished loading.
  invoke('desktop_info').then(i => { if (i.error) showError(i.error); }).catch(() => {});
</script>
</body>
</html>
