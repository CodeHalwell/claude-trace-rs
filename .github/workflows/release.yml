name: Release

# Tag a release to build installable artifacts for Windows, macOS and Linux:
#
#   git tag v0.3.0 && git push origin v0.3.0
#
# Produces per-platform archives, a Linux .deb, and SHA-256 checksums, and
# attaches them all to a GitHub Release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to release (for example: v0.3.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN: claude-trace-rs

jobs:
  resolve-tag:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      checkout_ref: ${{ steps.resolve.outputs.checkout_ref }}
    steps:
      - id: resolve
        shell: bash
        run: |
          RAW_TAG="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}"
          if [ -z "$RAW_TAG" ]; then
            echo "::error::A release tag is required"
            exit 1
          fi
          case "$RAW_TAG" in
            v*) TAG="$RAW_TAG" ;;
            *) TAG="v$RAW_TAG" ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=refs/tags/$TAG" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: resolve-tag
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && needs.resolve-tag.outputs.checkout_ref || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Resolve release version
        shell: bash
        run: |
          TAG="${{ needs.resolve-tag.outputs.tag }}"
          case "$TAG" in
            v*) ;;
            *)
              echo "::error::Release tag must start with 'v' (got: $TAG)"
              exit 1
              ;;
          esac
          VERSION="${TAG#v}"
          CRATE="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["packages"][0]["version"])')"
          if [ "$VERSION" != "$CRATE" ]; then
            echo "::error::Tag version $VERSION does not match Cargo.toml version $CRATE"
            exit 1
          fi
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install cross linker (aarch64 linux)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          NAME="${BIN}-${RELEASE_VERSION}-${{ matrix.target }}"
          mkdir -p "dist/$NAME"
          cp "target/${{ matrix.target }}/release/${BIN}" "dist/$NAME/"
          cp README.md LICENSE "dist/$NAME/" 2>/dev/null || true
          tar -C dist -czf "dist/${NAME}.tar.gz" "$NAME"
          (cd dist && shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256")

      - name: Package (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $name = "$env:BIN-$env:RELEASE_VERSION-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/$env:BIN.exe" "dist/$name/"
          Copy-Item README.md,LICENSE "dist/$name/" -ErrorAction SilentlyContinue
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower() | Out-File "dist/$name.zip.sha256"

      - name: Build .deb (linux x86_64)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo install cargo-deb --locked
          cargo deb --no-build --target ${{ matrix.target }} --output dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/*.deb

  release:
    name: Publish release
    needs:
      - resolve-tag
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' -o -name '*.deb' \) -exec cp {} release/ \;
          ls -la release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: false
