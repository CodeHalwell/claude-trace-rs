name: Publish to crates.io

# Publishes the crate to crates.io when a version tag is pushed.
# Requires a repository secret named CARGO_REGISTRY_TOKEN
# (create at https://crates.io/settings/tokens).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Verify tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CRATE="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import sys,json;print(json.load(sys.stdin)["packages"][0]["version"])')"
          if [ "$TAG" != "$CRATE" ]; then
            echo "::error::Tag v$TAG does not match Cargo.toml version $CRATE"
            exit 1
          fi

      - name: cargo publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
