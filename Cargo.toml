[workspace]
members = [".", "desktop"]
# `cargo build` / `cargo install` at the root build only the CLI, so users
# without the desktop toolchain (WebKitGTK on Linux) are unaffected. Build the
# desktop app with `cargo build -p agent-trace-desktop` (or `--workspace`).
default-members = ["."]

[package]
name = "claude-trace-rs"
version = "0.4.0"
edition = "2021"
description = "Local-first observability, trace database and dataset exporter for coding agents: Claude Code, Codex, Gemini CLI, Copilot, Cursor, Cline, OpenCode, Aider and more."
license = "MIT"
readme = "README.md"
repository = "https://github.com/CodeHalwell/claude-trace-rs"
homepage = "https://github.com/CodeHalwell/claude-trace-rs"
keywords = ["claude", "codex", "observability", "coding-agents", "tracing"]
categories = ["command-line-utilities", "development-tools", "visualization"]
authors = ["CodeHalwell"]
rust-version = "1.74"
exclude = ["desktop/", ".github/"]

[lib]
name = "claude_trace_rs"
path = "src/lib.rs"

[[bin]]
name = "claude-trace-rs"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws", "macros"] }
tower-http = { version = "0.5", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
futures-util = "0.3"
# Embedded, zero-dependency SQLite (compiled from source via `bundled`) — gives
# us a real persistent store for traces without asking users to install SQLite.
rusqlite = { version = "0.32", features = ["bundled"] }
# Cross-platform data/config directories for the on-disk database location.
directories = "5"
# Kimi and Cursor name session directories after an MD5 of the working
# directory; hashing known paths maps them back.
md-5 = "0.10"

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"

[profile.release]
# Slim, single binary for `cargo install --path .` distribution.
lto = "thin"
codegen-units = 1
strip = "symbols"

# Debian/Ubuntu package metadata (used by `cargo deb`).
[package.metadata.deb]
maintainer = "CodeHalwell"
copyright = "2026 CodeHalwell"
license-file = ["LICENSE", "0"]
extended-description = """
Local-first real-time observability dashboard and training-dataset exporter \
for coding agents (Claude Code, Codex, Gemini CLI, Copilot, Cursor, Cline, \
OpenCode, Aider and more), with a built-in SQLite trace database."""
section = "devel"
priority = "optional"
assets = [
    ["target/release/claude-trace-rs", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/claude-trace-rs/README.md", "644"],
    ["assets/claude-trace-rs.desktop", "usr/share/applications/claude-trace-rs.desktop", "644"],
]
